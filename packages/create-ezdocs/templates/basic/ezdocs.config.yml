version: "1.0"
name: "{{PROJECT_NAME}}"
description: "{{PROJECT_DESCRIPTION}}"

content:
  source: "./content"
  ignore: ["**/drafts/**", "**/*.draft.md"]

collections:
  docs:
    pattern: "docs/**/*.md"
    route: "/docs/{slug}"
    sort:
      by: "order"
      fallback: "title"
      order: "asc"
    nextra:
      sidebar: true
      searchable: true

  guides:
    pattern: "guides/**/*.md"
    route: "/guides/{slug}"
    sort:
      by: "date"
      order: "desc"
    nextra:
      sidebar: true
      breadcrumbs: true

site:
  title: "{{PROJECT_NAME}} Documentation"
  description: "{{PROJECT_DESCRIPTION}}"

output:
  nextra:
    directory: "./.ezdocs"
    theme: "docs"
  exports:
    - type: "json"
      path: "./content.json"
    - type: "typescript"
      path: "./src/generated/content.ts"

images:
  formats: ["webp", "jpeg"]
  sizes: [640, 1280, 1920]
  quality: 85

dev:
  port: 3000
  watch: true
  livereload: true